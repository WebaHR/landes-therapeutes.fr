<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e6f5c"/>
      <stop offset="100%" stop-color="#3f8a73"/>
    </linearGradient>
    <linearGradient id="circle1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="circle2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea86d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2ea86d" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Fond -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Cercles décoratifs -->
  <circle cx="1050" cy="-40" r="240" fill="url(#circle1)"/>
  <circle cx="900" cy="320" r="180" fill="url(#circle2)"/>
  <circle cx="120" cy="280" r="140" fill="url(#circle1)"/>
  <circle cx="300" cy="-60" r="160" fill="url(#circle2)"/>
  <!-- Motif de points -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1.5" fill="#ffffff" fill-opacity="0.12"/>
  </pattern>
  <rect width="1200" height="300" fill="url(#dots)"/>
  <!-- Texte placeholder -->
  <text x="600" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.5" letter-spacing="3">VOTRE BANNIÈRE</text>
  <text x="600" y="170" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#ffffff" fill-opacity="0.3" letter-spacing="1">Personnalisez-la depuis votre tableau de bord</text>
</svg>
